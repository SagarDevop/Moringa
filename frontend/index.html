    <script>
      (function() {
        if ('fonts' in document) {
          var timeout = setTimeout(function() {
            document.documentElement.classList.add('icons-loaded');
          }, 2000);
          document.fonts.load('24px "Material Symbols Outlined"').then(function() {
            clearTimeout(timeout);
            document.documentElement.classList.add('icons-loaded');
          }).catch(function() {
            clearTimeout(timeout);
            document.documentElement.classList.add('icons-loaded');
          });
        } else {
          document.documentElement.classList.add('icons-loaded');
        }
      })();
    </script>
